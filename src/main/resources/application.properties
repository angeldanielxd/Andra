spring.application.name=andra-javafx
spring.main.web-application-type=none
spring.main.banner-mode=off

spring.datasource.url=jdbc:sqlite:andra.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

logging.level.root=WARN
logging.level.pe.andra=INFO

app.seeder.enabled=true

app.institucion.andra-nombre=Instituci\u00f3n
app.institucion.andra-sigla=INST
app.institucion.andra-telefono=(01) 000-0000
app.institucion.andra-anexos=0000 / 0000
app.institucion.andra-correo-mesa-partes=mesadepartes@institucion.edu
app.institucion.andra-correo-soporte=soporte@institucion.edu
app.institucion.andra-correo-defensoria=defensoria@institucion.edu
app.institucion.andra-url-youtube=https://www.youtube.com
app.institucion.andra-url-facebook=https://www.facebook.com
app.institucion.andra-url-documentos=https://documentos.institucion.edu
app.conexion.url-prueba=https://www.google.com
